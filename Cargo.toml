[package]
name = "showrunner"
version = "0.17.0"
edition = "2024"
description = "A terminal UI for managing multiple coding agent sessions organized by projects and tasks"
license = "MIT"
repository = "https://github.com/Bendzae/claude-manager"
readme = "README.md"
keywords = ["agents", "tui", "tmux", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "showrunner"
path = "src/main.rs"

# Backwards-compatible alias: existing sessions, scripts, and the previously
# published skills invoke `claude-manager`.
[[bin]]
name = "claude-manager"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
anyhow = "1"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
